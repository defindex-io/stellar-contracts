[package]
name = "example-strategy"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate: opt out of the stellar-contracts workspace so it builds the way a
# third-party repo would, against the published crate rather than the local source.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enables src/test_vault.rs, which drives the real DeFindex vault WASM. Build it first:
#   (cd ../../../vault && make build)
vault-it = []

[dependencies]
soroban-sdk = "25.3.1"
defindex-strategy-core = "0.3.0"
# 1.5.0+ only: 1.3.0 and 1.4.0 carry a signed fixed-point rounding bug (CVE-2026-24783).
soroban-fixed-point-math = "1.5.0"

[dev-dependencies]
soroban-sdk = { version = "25.3.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
